packages:
  - apps/*
  - packages/*

# Dependencias a las que se les permite correr scripts de instalación.
allowBuilds:
  esbuild: true
  supabase: true
  unrs-resolver: true

# Versiones compartidas entre paquetes. Usar "catalog:" en cada package.json.
catalog:
  "@next/env": 16.3.7
  "@playwright/test": ^1.63.0
  "@supabase/ssr": ^0.12.7
  "@supabase/supabase-js": ^2.117.2
  "@eslint/js": ^9.39.5
  "@tailwindcss/postcss": ^4.3.3
  "@types/node": ^24.19.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  eslint: ^9.39.5
  eslint-config-next: 16.3.7
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  htmlparser2: ^12.0.0
  next: 16.3.7
  prettier: ^3.9.9
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.0
  react-dom: ^19.3.0
  server-only: ^0.0.1
  supabase: ^2.118.0
  tailwindcss: ^4.3.3
  tsup: ^8.5.1
  tsx: ^4.23.15
  turbo: ^2.11.5
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.2
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - "@next/env@16.3.7"
  - "@next/eslint-plugin-next@16.3.7"
  - "@next/swc-darwin-arm64@16.3.7"
  - "@next/swc-darwin-x64@16.3.7"
  - "@next/swc-linux-arm64-gnu@16.3.7"
  - "@next/swc-linux-arm64-musl@16.3.7"
  - "@next/swc-linux-x64-gnu@16.3.7"
  - "@next/swc-linux-x64-musl@16.3.7"
  - "@next/swc-win32-arm64-msvc@16.3.7"
  - "@next/swc-win32-x64-msvc@16.3.7"
  - eslint-config-next@16.3.7
  - next@16.3.7
