name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Valores ficticios: el build y los tests unitarios no se conectan a nada real. Solo en este
    # job: en el de integración pisarían al `.env` con las claves del Supabase local (las
    # variables ya exportadas ganan sobre las del archivo).
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  integration:
    name: Integración (Supabase local) y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Levantar Supabase local y generar .env
        run: pnpm db:start
      - name: Migraciones desde cero + seed
        run: pnpm db:reset
      - name: Los tipos generados coinciden con las migraciones
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/database.types.ts
      - run: pnpm test:integration
      - name: Instalar Chromium para Playwright
        run: pnpm --filter @asesor/web exec playwright install --with-deps chromium
      - name: Build de la web
        run: pnpm --filter @asesor/web build
      # Playwright levanta la web (`next start`) y el worker con IA y tiendas mock (paso 12a).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  worker-image:
    name: Imagen Docker del worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          tags: asesor-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
